plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'league_simulator'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.18.0'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'app.Main'
        )
    }
}
shadowJar {
    archiveBaseName.set("DynamicFootballSimulator")
    archiveClassifier.set('') // Prevents appending "-all" to the file name
    manifest {
        attributes(
                'Main-Class': 'app.Main'
        )
    }
}
